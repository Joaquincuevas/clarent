name: release

# Publishes to PyPI when a GitHub Release is published for a tag named v*.
# Authentication is PyPI Trusted Publishing (OIDC): there are no API tokens in this repo.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tests and method health
        run: |
          python tools/test_all.py
          python -m clarent doctor
        env:
          PYTHONPATH: src
      - name: Tag matches the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match pyproject version {version!r}")
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/clarent-methods/
    permissions:
      id-token: write   # required for Trusted Publishing; nothing else gets write access
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
