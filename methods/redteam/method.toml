id = "redteam"
name = "Red Team"
version = "0.1.0"
family = "military"
status = "beta"               # spec | beta | stable | reference
summary = "Attack a design doc or a PR with a fixed catalog of six attack classes; the engine rejects findings it cannot anchor in the text, builds an assumption matrix and ranks the top attacks."

[python]
module = "clarent_redteam"    # importable package inside this folder; must expose register(subparsers) and main(argv)

[surfaces]                    # what this method ships today (the doctor checks that each 'true' exists)
cli = true
skill = true
agent = false
hook = false
mcp = false
action = false

# verification: read = opened and read | exists = confirmed to exist | blocked = exists, server blocks scripts | unverified = from memory
