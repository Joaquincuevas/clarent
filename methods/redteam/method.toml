status = "exists-but-weak"    # none | exists-but-weak | exists-but-abandoned | well-covered
evidence = "Prompt-only devil's advocate and plan stress-test skills exist (aaddrick/contrarian 43 stars; Hainrixz/abogado-del-diablo 43; orange2ai/devils-advocate-skill 33; five premortem skills of 30-88 stars). Adversarial PR review is established (liliu-z/magpie 180 stars; liatrio-labs/claude-code-gauntlet 13; YahampathChandika/adv-review 6, with a calibration benchmark), but its findings are verified by other LLM passes. None of the READMEs and file lists read describes an engine that rejects findings by checking quotes against the text, an assumption matrix with verified/unverified/contradicted status, or a fixed class catalog with coverage; the code of these repos was not read"
