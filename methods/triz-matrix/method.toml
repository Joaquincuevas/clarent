id = "triz-matrix"
name = "TRIZ Contradiction Matrix"
version = "0.1.0"
family = "soviet"
status = "beta"               # spec | beta | stable | reference
summary = "Given a parameter you want to improve and one that gets worse, return Altshuller's inventive principles with software examples; every cell is checked against the 1973 table."

[python]
module = "clarent_triz"       # importable package inside this folder; exposes register(subparsers) and main(argv)

[surfaces]
cli = true
skill = true
agent = false
hook = false
mcp = false
action = false

# verification: read = opened and read | exists = confirmed to exist | blocked = exists, server blocks scripts | unverified = from memory
