evidence = "At least 8 small repos (mostly MIT) ship a TRIZ matrix lookup as an agent skill or tool; the most-starred are ironyjk/strategy-frameworks (47 stars, TRIZ among 30 frameworks) and Antropocosmist/triz-engineering-solver (24). None found with a stdlib engine, tests, per-cell verification against the 1973 table, or software readings of the parameters. The space is crowded: this method is not novel in itself."
