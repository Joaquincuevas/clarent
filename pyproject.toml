[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clarent-methods"        # 'clarent' on PyPI is an unrelated abandoned 2014 package
version = "0.1.1"
description = "Classic decision, optimization and engineering methodologies as executable developer tools."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Joaquín Cuevas Muñoz" }]
keywords = ["methodology", "debugging", "claude-code", "agents", "root-cause-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []               # the core and every shipped method are stdlib-only

[project.urls]
Homepage = "https://github.com/Joaquincuevas/clarent"
Repository = "https://github.com/Joaquincuevas/clarent"
Issues = "https://github.com/Joaquincuevas/clarent/issues"
Documentation = "https://github.com/Joaquincuevas/clarent#readme"
Changelog = "https://github.com/Joaquincuevas/clarent/blob/main/CHANGELOG.md"

[project.scripts]
clarent = "clarent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clarent"]

[tool.hatch.build.targets.wheel.force-include]
"methods" = "clarent/_methods"
