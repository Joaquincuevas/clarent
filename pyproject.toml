[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "clarent-methods"        # 'clarent' on PyPI is an unrelated abandoned 2014 package
version = "0.1.0"
description = "Classic decision, optimization and engineering methodologies as executable developer tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["methodology", "debugging", "claude-code", "agents", "root-cause-analysis"]
dependencies = []               # the core and every shipped method are stdlib-only

[project.scripts]
clarent = "clarent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clarent"]

[tool.hatch.build.targets.wheel.force-include]
"methods" = "clarent/_methods"
